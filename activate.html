<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activate Account - KenyaSurvey</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    font-family: Inter, Arial, sans-serif;
}

body {
    background: #08120a;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,.25);
    border-top-color: white;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}
</style>
</head>

<body class="bg-[#08120a] text-white min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-[430px]">

    <!-- BACK -->
    <button
        onclick="goBack()"
        id="backButton"
        class="flex items-center gap-2 text-[12px] text-white/50 hover:text-white transition mb-6">

        <span class="text-[18px]">←</span>
        Back to Dashboard

    </button>


    <!-- MAIN CARD -->
    <div class="bg-[#132016] border border-[#1f3522] rounded-[22px] p-6">

        <!-- ICON -->
        <div class="w-14 h-14 bg-[#0f9d58]/15 rounded-2xl grid place-items-center text-[26px] mx-auto">
            🔐
        </div>


        <h1 class="text-center text-[22px] font-extrabold mt-5">
            Activate Your Account
        </h1>


        <p class="text-center text-[12px] text-white/50 leading-5 mt-2">
            Activate your KenyaSurvey participant account to access research surveys.
        </p>


        <!-- ACTIVATION AMOUNT -->
        <div class="mt-6 bg-[#0f9d58]/10 border border-[#0f9d58]/20 rounded-2xl p-5 text-center">

            <p class="text-[10px] text-white/50 uppercase tracking-wider">
                One-Time Account Activation
            </p>

            <p class="text-[30px] font-black text-[#0f9d58] mt-2">
                KSh 350
            </p>

        </div>


        <!-- ACCOUNT STATUS -->
        <div
            id="statusBox"
            class="mt-5 bg-black/20 border border-white/5 rounded-xl p-4">

            <p class="text-[10px] text-white/40 uppercase tracking-wider">
                Account Status
            </p>

            <p
                id="statusText"
                class="text-[13px] font-semibold text-yellow-400 mt-1">

                Activation required

            </p>

        </div>


        <!-- PHONE -->
        <div class="mt-5">

            <label class="text-[12px] font-semibold text-white/70">
                M-Pesa Phone Number
            </label>

            <input
                id="phoneNumber"
                type="tel"
                inputmode="numeric"
                placeholder="0712345678"
                maxlength="13"
                class="w-full h-[50px] mt-2 bg-[#08120a] border border-[#1f3522] rounded-xl px-4 text-[14px] text-white outline-none focus:border-[#0f9d58]">

        </div>


        <!-- MESSAGE -->
        <div
            id="messageBox"
            class="hidden mt-4 rounded-xl px-4 py-3 text-[11px] leading-5">
        </div>


        <!-- ACTIVATE BUTTON -->
        <button
            id="activateButton"
            onclick="activateAccount()"
            class="w-full h-[52px] mt-5 bg-[#0f9d58] hover:bg-[#0c874a] rounded-xl font-bold text-[14px] transition flex items-center justify-center gap-2">

            Activate for KSh 350

        </button>


        <p class="text-center text-[10px] text-white/35 leading-5 mt-4">

            An M-Pesa STK Push will be sent to your phone.
            Your account will activate automatically after successful payment.

        </p>

    </div>

</div>


<script>

/* =========================================
   CURRENT LOGGED-IN USER
========================================= */

const currentUser =
    localStorage.getItem(
        "kenyaSurveyCurrentUser"
    );


if (!currentUser) {

    window.location.href =
        "register.html";

}


/* =========================================
   ELEMENTS
========================================= */

const phoneInput =
    document.getElementById(
        "phoneNumber"
    );


const activateButton =
    document.getElementById(
        "activateButton"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const messageBox =
    document.getElementById(
        "messageBox"
    );


let checkingPayment = false;

let checkInterval = null;


/* =========================================
   PREFILL MEMBER PHONE
========================================= */

const members =
    JSON.parse(
        localStorage.getItem(
            "kenyaSurveyMembers"
        )
    ) || {};


const user =
    members[currentUser];


if (user && user.phone) {

    phoneInput.value =
        user.phone;

} else {

    phoneInput.value =
        currentUser;

}


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
    message,
    type = "error"
) {

    messageBox.classList.remove(
        "hidden",
        "bg-red-500/10",
        "border-red-500/20",
        "text-red-300",
        "bg-green-500/10",
        "border-green-500/20",
        "text-green-300",
        "bg-yellow-500/10",
        "border-yellow-500/20",
        "text-yellow-300"
    );


    if (type === "success") {

        messageBox.classList.add(
            "bg-green-500/10",
            "border",
            "border-green-500/20",
            "text-green-300"
        );

    }

    else if (type === "pending") {

        messageBox.classList.add(
            "bg-yellow-500/10",
            "border",
            "border-yellow-500/20",
            "text-yellow-300"
        );

    }

    else {

        messageBox.classList.add(
            "bg-red-500/10",
            "border",
            "border-red-500/20",
            "text-red-300"
        );

    }


    messageBox.textContent =
        message;

}


/* =========================================
   FORMAT PHONE
========================================= */

function formatPhone(phone) {

    phone =
        String(phone)
        .replace(/\s/g, "")
        .replace("+", "");


    if (phone.startsWith("0")) {

        phone =
            "254" +
            phone.substring(1);

    }


    if (phone.startsWith("7")) {

        phone =
            "254" + phone;

    }


    if (!/^2547\d{8}$/.test(phone)) {

        return null;

    }


    return phone;

}


/* =========================================
   ACTIVATE ACCOUNT
========================================= */

async function activateAccount() {

    const phone =
        formatPhone(
            phoneInput.value
        );


    if (!phone) {

        showMessage(
            "Enter a valid Kenyan M-Pesa phone number."
        );

        return;

    }


    /* LOCK BUTTON */

    activateButton.disabled =
        true;


    activateButton.innerHTML =
        `<div class="spinner"></div>
         Sending STK Push...`;


    try {

        const response =
            await fetch(
                "/api/activate",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            phone:
                                phone,

                            userPhone:
                                currentUser

                        })

                }
            );


        /*
        =====================================
        IMPORTANT:
        READ RESPONSE AS TEXT FIRST

        This prevents:
        Unexpected token 'A'
        Unexpected token 'T'

        when Vercel returns an HTML or
        plain-text server error.
        =====================================
        */

        const text =
            await response.text();


        console.log(
            "ACTIVATE API RESPONSE:",
            text
        );


        let data;


        try {

            data =
                JSON.parse(text);

        }

        catch (jsonError) {

            console.error(
                "INVALID SERVER RESPONSE:",
                text
            );


            throw new Error(

                text ||
                "The server returned an invalid response."

            );

        }


        /*
        =====================================
        HTTP ERROR
        =====================================
        */

        if (!response.ok) {

            throw new Error(

                data.message ||
                data.error ||
                "Unable to process activation."

            );

        }


        /*
        =====================================
        API ERROR
        =====================================
        */

        if (!data.success) {

            throw new Error(

                data.message ||
                "Unable to send the M-Pesa request."

            );

        }


        /*
        =====================================
        ALREADY ACTIVATED
        =====================================
        */

        if (
            data.activated === true
        ) {

            statusText.textContent =
                "Account activated";


            statusText.className =
                "text-[13px] font-semibold text-[#0f9d58] mt-1";


            showMessage(
                "Your account is already activated.",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "surveys.html";

                },
                1000
            );


            return;

        }


        /*
        =====================================
        STK PUSH SENT
        =====================================
        */

        statusText.textContent =
            "Waiting for M-Pesa payment";


        statusText.className =
            "text-[13px] font-semibold text-yellow-400 mt-1";


        showMessage(
            "STK Push sent. Enter your M-Pesa PIN to complete payment.",
            "pending"
        );


        activateButton.innerHTML =
            `<div class="spinner"></div>
             Waiting for payment...`;


        checkingPayment =
            true;


        phoneInput.disabled =
            true;


        /* START CHECKING PAYMENT */

        startPaymentCheck();

    }


    catch (error) {

        console.error(
            "ACTIVATION ERROR:",
            error
        );


        showMessage(
            error.message ||
            "Unable to connect to the activation server."
        );


        activateButton.disabled =
            false;


        activateButton.innerHTML =
            "Activate for KSh 350";

    }

}


/* =========================================
   CHECK ACTIVATION STATUS
========================================= */

function startPaymentCheck() {

    if (checkInterval) {

        clearInterval(
            checkInterval
        );

    }


    checkInterval =
        setInterval(
            checkPaymentStatus,
            3000
        );


    checkPaymentStatus();

}


/* =========================================
   CHECK PAYMENT
========================================= */

async function checkPaymentStatus() {

    if (!checkingPayment) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/check-activation",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            userPhone:
                                currentUser

                        })

                }
            );


        /*
        READ AS TEXT FIRST
        */

        const text =
            await response.text();


        console.log(
            "CHECK ACTIVATION RESPONSE:",
            text
        );


        let data;


        try {

            data =
                JSON.parse(text);

        }

        catch (jsonError) {

            console.error(
                "INVALID STATUS RESPONSE:",
                text
            );

            return;

        }


        /*
        PAYMENT SUCCESS
        */

        if (
            data.activated === true
        ) {

            checkingPayment =
                false;


            clearInterval(
                checkInterval
            );


            statusText.textContent =
                "Account activated";


            statusText.className =
                "text-[13px] font-semibold text-[#0f9d58] mt-1";


            showMessage(
                "Payment confirmed successfully. Your account is now activated.",
                "success"
            );


            activateButton.innerHTML =
                "✓ Account Activated";


            /*
            SAVE ACTIVATION LOCALLY
            */

            const storedMembers =
                JSON.parse(
                    localStorage.getItem(
                        "kenyaSurveyMembers"
                    )
                ) || {};


            if (
                storedMembers[currentUser]
            ) {

                storedMembers[currentUser]
                    .activated =
                    true;


                localStorage.setItem(

                    "kenyaSurveyMembers",

                    JSON.stringify(
                        storedMembers
                    )

                );

            }


            setTimeout(
                () => {

                    window.location.href =
                        "surveys.html";

                },
                1500
            );

        }


        /*
        PAYMENT FAILED
        */

        else if (
            data.status === "FAILED"
        ) {

            checkingPayment =
                false;


            clearInterval(
                checkInterval
            );


            phoneInput.disabled =
                false;


            activateButton.disabled =
                false;


            activateButton.innerHTML =
                "Try Again";


            statusText.textContent =
                "Payment not completed";


            statusText.className =
                "text-[13px] font-semibold text-red-400 mt-1";


            showMessage(

                data.message ||
                "Payment was cancelled or failed. Please try again."

            );

        }

    }


    catch (error) {

        console.error(
            "STATUS CHECK ERROR:",
            error
        );

    }

}


/* =========================================
   BACK BUTTON
========================================= */

function goBack() {

    if (checkingPayment) {

        const leave =
            confirm(
                "A payment request is still pending. Do you want to leave?"
            );


        if (!leave) {

            return;

        }

    }


    window.location.href =
        "dashboard.html";

}

</script>

</body>
</html>

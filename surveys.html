<title>Research Surveys</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,sans-serif;
}

body{
    background:#070d07;
    color:#e5e5e5;
    min-height:100vh;
}

.top{
    position:sticky;
    top:0;
    z-index:50;
    background:#0a1a0d;
    border-bottom:1px solid #14301a;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
}

.balance{
    display:flex;
    align-items:center;
    gap:8px;
    background:#112416;
    border:1px solid #1d3d23;
    border-radius:12px;
    padding:6px 14px;
    color:#12c46b;
    font-weight:900;
    font-size:17px;
}

.back-btn{
    background:none;
    border:0;
    color:#9aaa9d;
    font-size:21px;
    cursor:pointer;
}

.toast{
    margin:12px;
    background:#152a18;
    border:1px solid #234429;
    border-left:3px solid #12c46b;
    border-radius:14px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
}

.av{
    width:40px;
    height:40px;
    background:#0f6d3a;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-weight:800;
}

.info{
    margin:12px;
    background:#111d12;
    border:1px solid #1a2f1e;
    border-radius:16px;
    padding:16px;
}

.info h1{
    font-size:19px;
    color:#fff;
    margin-bottom:7px;
}

.info p{
    color:#87978b;
    font-size:12px;
    line-height:1.6;
}

.stats{
    margin:12px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    background:#111d12;
    border:1px solid #1a2f1e;
    border-radius:14px;
    padding:11px;
}

.stat-value{
    font-size:16px;
    font-weight:900;
    color:#12c46b;
}

.stat-label{
    margin-top:3px;
    font-size:9px;
    color:#6f8073;
}

.chapter{
    margin:12px;
    background:#132816;
    border:1px solid #1d3d23;
    border-radius:20px;
    padding:16px;
    cursor:pointer;
    transition:.2s;
}

.chapter:hover{
    border-color:#12c46b;
    transform:translateY(-1px);
}

.chapter-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.chapter-title h3{
    font-size:14px;
    color:#fff;
}

.chapter-title span{
    font-size:10px;
    color:#12c46b;
}

.chapter-desc{
    color:#708074;
    font-size:10px;
    margin-top:6px;
}

.progress{
    height:5px;
    background:#081209;
    border-radius:99px;
    overflow:hidden;
    margin-top:12px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#12c46b;
    transition:.3s;
}

.card{
    margin:12px;
    background:#132816;
    border:1px solid #1d3d23;
    border-radius:20px;
    padding:16px;
    position:relative;
}

.card.completed{
    opacity:.65;
}

.question-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.pill{
    font-size:10px;
    font-weight:800;
    letter-spacing:.8px;
    background:#0e2814;
    color:#12c46b;
    border:1px solid #1d3d23;
    padding:4px 10px;
    border-radius:999px;
}

.reward{
    color:#f5b400;
    font-weight:800;
    font-size:14px;
}

.q{
    font-size:17px;
    font-weight:700;
    margin:14px 0;
    line-height:1.45;
    color:#fff;
}

.opt{
    width:100%;
    text-align:left;
    background:#0a1a0d;
    border:1px solid #1f3d26;
    border-radius:14px;
    padding:14px 16px;
    margin-top:10px;
    font-size:14px;
    color:#8aa08e;
    cursor:pointer;
    transition:.2s;
}

.opt:hover{
    border-color:#12c46b;
    color:#fff;
}

.opt:active{
    transform:scale(.98);
}

.opt.correct{
    background:#12c46b!important;
    color:#000!important;
    border-color:#12c46b!important;
    font-weight:700;
}

.opt.wrong{
    background:#4a1e1e!important;
    border-color:#7a2a2a!important;
    color:#fff!important;
}

.opt:disabled{
    cursor:default;
}

.result{
    display:none;
    margin-top:14px;
    border-radius:12px;
    padding:11px;
    font-size:11px;
    line-height:1.5;
}

.result.good{
    display:block;
    background:#0d3420;
    border:1px solid #12c46b;
    color:#7ff0b2;
}

.result.bad{
    display:block;
    background:#351616;
    border:1px solid #7a2a2a;
    color:#ffaaaa;
}

.next-btn{
    display:none;
    width:100%;
    margin-top:12px;
    height:45px;
    border:0;
    border-radius:12px;
    background:#12c46b;
    color:#001d0c;
    font-weight:900;
    cursor:pointer;
}

.next-btn.show{
    display:block;
}

.back-dashboard{
    width:calc(100% - 24px);
    margin:20px 12px;
    height:46px;
    border-radius:13px;
    background:#111d12;
    color:#9aaa9d;
    border:1px solid #1a2f1e;
    cursor:pointer;
}

.empty{
    margin:12px;
    padding:35px 18px;
    background:#111d12;
    border:1px solid #1a2f1e;
    border-radius:18px;
    text-align:center;

    font-size:16px;
    color:#fff;

.empty p{

    color:#728074;
    font-size:11px;
    line-height:1.6;
}

.hidden{
    display:none!important;

@media(max-width:500px){

    }

    }

    .stat-value{

    }

    .q{
        font-size:16px;
    }

}
</style>

/* =========================================================
   ACCOUNT
========================================================= */

const currentUser =
    localStorage.getItem("kenyaSurveyCurrentUser");

if(!currentUser){

    window.location.href =
        "register.html";

}

const members =
    JSON.parse(
        localStorage.getItem("kenyaSurveyMembers")
    ) || {};

const user =
    members[currentUser];

if(!user){

    localStorage.removeItem(
        "kenyaSurveyCurrentUser"
    );

    window.location.href =
        "register.html";

}


/* =========================================================
   INITIAL USER DATA
========================================================= */

if(user.availableBalance === undefined)
    user.availableBalance = 0;

if(user.totalCompensation === undefined)
    user.totalCompensation = 0;

if(user.completedSurveys === undefined)
    user.completedSurveys = 0;

if(user.remainingSurveys === undefined)
    user.remainingSurveys = 0;

if(!Array.isArray(user.activities))
    user.activities = [];


/* =========================================================
   PERMANENT COMPLETED QUESTION STORAGE
========================================================= */

if(!Array.isArray(user.completedQuestionIds))
    user.completedQuestionIds = [];


/* =========================================================
   WEEKLY DATA
========================================================= */

if(!user.surveyWeek)
    user.surveyWeek = getWeekKey();


/* =========================================================
   USER DISPLAY
========================================================= */

const registeredName =
    user.fullName ||
    "Participant";

document.getElementById(
    "welcomeText"
).textContent =
    "Welcome, " + registeredName;


const initials =
    registeredName
        .split(" ")
        .filter(Boolean)
        .slice(0,2)
        .map(x => x.charAt(0).toUpperCase())
        .join("");


document.getElementById(
    "avatar"
).textContent =
    initials || "P";


/* =========================================================
   SAVE USER
========================================================= */

function saveUser(){

    members[currentUser] = user;

    localStorage.setItem(
        "kenyaSurveyMembers",
        JSON.stringify(members)
    );

}


/* =========================================================
   WEEK KEY
========================================================= */

function getWeekKey(){

    const now =
        new Date();

    const first =
        new Date(
            now.getFullYear(),
            0,
            1
        );

    const days =
        Math.floor(
            (
                now - first
            ) /
            86400000
        );

    const week =
        Math.ceil(
            (
                days +
                first.getDay() +
                1
            ) / 7
        );

    return (
        now.getFullYear() +
        "-W" +
        week
    );

}
